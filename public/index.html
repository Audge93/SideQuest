<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Side Quest</title>

    <!-- Phone web app: dark browser chrome and "Add to Home Screen" full-screen mode -->
    <meta name="theme-color" content="#1B1430" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Side Quest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #1b1430;
      }
      body {
        overflow: hidden;
        /* No rubber-band page bounce, gray tap flashes, double-tap zoom, or long-press callouts */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- If the app fails to start, show the error instead of a blank screen (handy when testing on a phone). -->
    <script>
      (function () {
        function showError(message) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0 && root.innerText.trim().length > 0) return;
          var box = document.createElement('div');
          box.setAttribute('style', 'margin:auto;padding:24px;max-width:340px;color:#fff;font:600 15px -apple-system,system-ui,sans-serif;text-align:center');
          box.innerHTML = '<div style="font-size:20px;margin-bottom:10px">Side Quest couldn\'t start</div>' +
            '<div style="opacity:.75;word-break:break-word;margin-bottom:16px"></div>' +
            '<button style="font:700 16px system-ui;padding:10px 22px;border-radius:12px;border:0;background:#3dbe6e;color:#fff">Reload</button>';
          box.children[1].textContent = String(message || 'Unknown error');
          box.children[2].onclick = function () { location.reload(); };
          document.body.appendChild(box);
        }
        window.addEventListener('error', function (e) { setTimeout(function () { showError(e.message); }, 1500); });
        window.addEventListener('unhandledrejection', function (e) {
          setTimeout(function () { showError(e.reason && (e.reason.message || e.reason)); }, 1500);
        });
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
